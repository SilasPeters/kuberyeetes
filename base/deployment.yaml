apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratshapes-deployment
spec:
  selector:
    matchLabels:
      app: ratshapes
  template:
    metadata:
      labels:
        app: ratshapes
    spec:
      containers:
      - name: ratshapes-api
        image: ghcr.io/silaspeters/rat-shapes-api:latest
        ports:
        - containerPort: 8000
          name: rs-api
      - name: ratshapes-frontend
        image: ghcr.io/silaspeters/rat-shapes-frontend:latest
        ports:
        - containerPort: 8080
          name: rs-frontend
        env:
        - name: API_BASE_URL
          value: http://ratshapes-api:8000
